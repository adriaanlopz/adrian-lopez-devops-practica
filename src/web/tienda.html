<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tienda online · Panel de gestión</title>
<style>
  :root { --fondo: #eef1f5; --panel: #ffffff; --texto: #1d2330; --suave: #5f6b7a; --borde: #d5dbe3; --acento: #2457c5; --error: #b3261e; --ok: #1b7a3d; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", system-ui, sans-serif; background: var(--fondo); color: var(--texto); }
  header { background: var(--acento); color: #fff; padding: 14px 20px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
  header h1 { margin: 0; font-size: 20px; }
  header input { width: 220px; padding: 5px 8px; border: none; border-radius: 4px; }
  #estado { font-size: 13px; }
  nav { display: flex; gap: 4px; padding: 12px 20px 0; }
  nav button { border: 1px solid var(--borde); border-bottom: none; background: #dfe4ec; padding: 8px 16px; border-radius: 6px 6px 0 0; cursor: pointer; font: inherit; }
  nav button.activa { background: var(--panel); font-weight: 600; }
  .pestana { display: none; background: var(--panel); margin: 0 20px 20px; padding: 18px; border: 1px solid var(--borde); border-radius: 0 6px 6px 6px; }
  .pestana.activa { display: block; }
  .columnas { display: grid; grid-template-columns: 320px 1fr; gap: 24px; }
  @media (max-width: 760px) { .columnas { grid-template-columns: 1fr; } }
  h2 { margin: 0 0 12px; font-size: 16px; }
  form { display: grid; gap: 8px; }
  label { display: grid; gap: 3px; font-size: 13px; color: var(--suave); }
  input, select { font: inherit; padding: 6px 8px; border: 1px solid var(--borde); border-radius: 4px; color: var(--texto); }
  button.principal { background: var(--acento); color: #fff; border: none; padding: 8px; border-radius: 4px; cursor: pointer; font: inherit; }
  button.peque { background: none; border: 1px solid var(--borde); border-radius: 4px; cursor: pointer; padding: 2px 8px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 7px 6px; border-bottom: 1px solid var(--borde); vertical-align: top; }
  th { color: var(--suave); font-weight: 600; }
  .vacio { color: var(--suave); font-style: italic; }
  .fila { display: flex; gap: 6px; }
  .fila > * { flex: 1; }
  #aviso { position: fixed; bottom: 16px; right: 16px; max-width: 360px; padding: 10px 14px; border-radius: 6px; color: #fff; display: none; }
  #aviso.error { background: var(--error); display: block; }
  #aviso.ok { background: var(--ok); display: block; }
</style>
</head>
<body>
<header>
  <h1>Tienda online · Panel de gestión</h1>
  <div>
    <label style="color:#fff">API <input id="url-api" value="http://127.0.0.1:8000"></label>
    <span id="estado"></span>
  </div>
</header>

<nav>
  <button data-pestana="usuarios" class="activa">Usuarios</button>
  <button data-pestana="productos">Productos</button>
  <button data-pestana="pedidos">Pedidos</button>
</nav>

<section id="usuarios" class="pestana activa">
  <div class="columnas">
    <div>
      <h2>Nuevo usuario</h2>
      <form id="form-usuario">
        <label>Tipo
          <select name="tipo" id="tipo-usuario">
            <option value="cliente">Cliente</option>
            <option value="administrador">Administrador</option>
          </select>
        </label>
        <label>Nombre <input name="nombre" required></label>
        <label>Email <input name="email" type="email" required></label>
        <label id="campo-direccion">Dirección postal <input name="direccion_postal"></label>
        <button class="principal">Crear usuario</button>
      </form>
    </div>
    <div>
      <h2>Usuarios registrados</h2>
      <table>
        <thead><tr><th>Nombre</th><th>Email</th><th>Rol</th></tr></thead>
        <tbody id="lista-usuarios"></tbody>
      </table>
    </div>
  </div>
</section>

<section id="productos" class="pestana">
  <div class="columnas">
    <div>
      <h2>Nuevo producto</h2>
      <form id="form-producto">
        <label>Tipo
          <select name="tipo" id="tipo-producto">
            <option value="generico">Genérico</option>
            <option value="electronico">Electrónico</option>
            <option value="ropa">Ropa</option>
          </select>
        </label>
        <label>Nombre <input name="nombre" required></label>
        <div class="fila">
          <label>Precio (€) <input name="precio" type="number" step="0.01" min="0.01" required></label>
          <label>Stock <input name="stock" type="number" step="1" min="0" required></label>
        </div>
        <label class="solo-electronico">Meses de garantía <input name="meses_garantia" type="number" min="0"></label>
        <div class="fila solo-ropa">
          <label>Talla <input name="talla"></label>
          <label>Color <input name="color"></label>
        </div>
        <button class="principal">Crear producto</button>
      </form>
    </div>
    <div>
      <h2>Inventario</h2>
      <table>
        <thead><tr><th>Producto</th><th>Tipo</th><th>Precio</th><th>Stock</th><th>Detalles</th><th></th></tr></thead>
        <tbody id="lista-productos"></tbody>
      </table>
    </div>
  </div>
</section>

<section id="pedidos" class="pestana">
  <div class="columnas">
    <div>
      <h2>Nuevo pedido</h2>
      <form id="form-pedido">
        <label>Cliente <select id="pedido-cliente" required></select></label>
        <div class="fila">
          <label>Producto <select id="pedido-producto"></select></label>
          <label style="flex:0 0 80px">Cantidad <input id="pedido-cantidad" type="number" min="1" value="1"></label>
        </div>
        <button type="button" class="peque" id="anadir-linea">+ Añadir línea</button>
        <table>
          <tbody id="lineas-pedido"></tbody>
        </table>
        <button class="principal">Realizar pedido</button>
      </form>
    </div>
    <div>
      <h2>Historial de <select id="historial-cliente"></select></h2>
      <table>
        <thead><tr><th>Fecha</th><th>Productos</th><th>Total</th></tr></thead>
        <tbody id="lista-pedidos"></tbody>
      </table>
    </div>
  </div>
</section>

<div id="aviso"></div>

<script>
let usuarios = [];
let productos = [];
let lineas = [];

const $ = (id) => document.getElementById(id);
const euros = (n) => n.toLocaleString("es-ES", { style: "currency", currency: "EUR" });

function aviso(texto, tipo) {
  const caja = $("aviso");
  caja.textContent = texto;
  caja.className = tipo;
  clearTimeout(caja.temporizador);
  caja.temporizador = setTimeout(() => (caja.className = ""), 4000);
}

async function api(metodo, ruta, datos) {
  let respuesta;
  try {
    respuesta = await fetch($("url-api").value.replace(/\/$/, "") + ruta, {
      method: metodo,
      headers: { "Content-Type": "application/json" },
      body: datos ? JSON.stringify(datos) : undefined,
    });
  } catch {
    $("estado").textContent = "● Sin conexión";
    throw new Error("No se puede conectar con la API. ¿Está arrancada?");
  }
  $("estado").textContent = "● Conectado";
  if (respuesta.status === 204) return null;
  const cuerpo = await respuesta.json();
  if (!respuesta.ok) {
    const detalle = Array.isArray(cuerpo.detail)
      ? cuerpo.detail.map((e) => `${e.loc.slice(1).join(".")}: ${e.msg}`).join("; ")
      : cuerpo.detail;
    throw new Error(`Error ${respuesta.status}: ${detalle}`);
  }
  return cuerpo;
}

function celda(fila, texto, clase) {
  const td = fila.insertCell();
  td.textContent = texto;
  if (clase) td.className = clase;
  return td;
}

function filaVacia(tbody, columnas, texto) {
  const td = tbody.insertRow().insertCell();
  td.colSpan = columnas;
  td.textContent = texto;
  td.className = "vacio";
}

function rellenarSelect(select, elementos, texto) {
  const anterior = select.value;
  select.replaceChildren(...elementos.map((e) => new Option(texto(e), e.id)));
  if (elementos.some((e) => e.id === anterior)) select.value = anterior;
}

function detallesProducto(p) {
  if (p.tipo === "electronico") return `Garantía: ${p.meses_garantia} meses`;
  if (p.tipo === "ropa") return `Talla ${p.talla}, ${p.color}`;
  return "";
}

async function cargarUsuarios() {
  usuarios = await api("GET", "/usuarios");
  const tbody = $("lista-usuarios");
  tbody.replaceChildren();
  if (!usuarios.length) filaVacia(tbody, 3, "Todavía no hay usuarios");
  for (const u of usuarios) {
    const fila = tbody.insertRow();
    celda(fila, u.nombre);
    celda(fila, u.email);
    celda(fila, u.es_admin ? "Administrador" : "Cliente");
  }
  const clientes = usuarios.filter((u) => !u.es_admin);
  rellenarSelect($("pedido-cliente"), clientes, (u) => u.nombre);
  rellenarSelect($("historial-cliente"), clientes, (u) => u.nombre);
  await cargarPedidos();
}

async function cargarProductos() {
  productos = await api("GET", "/productos");
  const tbody = $("lista-productos");
  tbody.replaceChildren();
  if (!productos.length) filaVacia(tbody, 6, "El inventario está vacío");
  for (const p of productos) {
    const fila = tbody.insertRow();
    celda(fila, p.nombre);
    celda(fila, p.tipo);
    celda(fila, euros(p.precio));
    celda(fila, p.stock);
    celda(fila, detallesProducto(p));
    const borrar = document.createElement("button");
    borrar.className = "peque";
    borrar.textContent = "Eliminar";
    borrar.onclick = () => eliminarProducto(p);
    fila.insertCell().append(borrar);
  }
  rellenarSelect($("pedido-producto"), productos, (p) => `${p.nombre} (${p.stock} uds.)`);
}

async function cargarPedidos() {
  const tbody = $("lista-pedidos");
  tbody.replaceChildren();
  const clienteId = $("historial-cliente").value;
  if (!clienteId) return filaVacia(tbody, 3, "No hay clientes");
  const pedidos = await api("GET", `/usuarios/${clienteId}/pedidos`);
  if (!pedidos.length) filaVacia(tbody, 3, "Este cliente no tiene pedidos");
  for (const pedido of pedidos) {
    const fila = tbody.insertRow();
    celda(fila, new Date(pedido.fecha).toLocaleString("es-ES"));
    celda(fila, pedido.items.map((i) => `${i.cantidad}× ${i.nombre}`).join(", "));
    celda(fila, euros(pedido.total));
  }
}

async function eliminarProducto(producto) {
  if (!confirm(`¿Eliminar "${producto.nombre}"?`)) return;
  try {
    await api("DELETE", `/productos/${producto.id}`);
    aviso(`Eliminado: ${producto.nombre}`, "ok");
    lineas = lineas.filter((l) => l.producto.id !== producto.id);
    pintarLineas();
    await cargarProductos();
  } catch (error) {
    aviso(error.message, "error");
  }
}

function pintarLineas() {
  const tbody = $("lineas-pedido");
  tbody.replaceChildren();
  if (!lineas.length) return filaVacia(tbody, 3, "Sin líneas todavía");
  lineas.forEach((linea, indice) => {
    const fila = tbody.insertRow();
    celda(fila, `${linea.cantidad}× ${linea.producto.nombre}`);
    celda(fila, euros(linea.cantidad * linea.producto.precio));
    const quitar = document.createElement("button");
    quitar.type = "button";
    quitar.className = "peque";
    quitar.textContent = "✕";
    quitar.onclick = () => { lineas.splice(indice, 1); pintarLineas(); };
    fila.insertCell().append(quitar);
  });
}

function datosFormulario(form) {
  return Object.fromEntries([...new FormData(form)].filter(([, valor]) => valor !== ""));
}

function mostrarCamposProducto() {
  const tipo = $("tipo-producto").value;
  document.querySelectorAll(".solo-electronico").forEach((e) => (e.hidden = tipo !== "electronico"));
  document.querySelectorAll(".solo-ropa").forEach((e) => (e.hidden = tipo !== "ropa"));
}

document.querySelectorAll("nav button").forEach((boton) => {
  boton.onclick = () => {
    document.querySelectorAll("nav button, .pestana").forEach((e) => e.classList.remove("activa"));
    boton.classList.add("activa");
    $(boton.dataset.pestana).classList.add("activa");
  };
});

$("tipo-usuario").onchange = () => ($("campo-direccion").hidden = $("tipo-usuario").value !== "cliente");
$("tipo-producto").onchange = mostrarCamposProducto;
$("historial-cliente").onchange = () => cargarPedidos().catch((e) => aviso(e.message, "error"));
$("url-api").onchange = () => iniciar();

$("form-usuario").onsubmit = async (evento) => {
  evento.preventDefault();
  const datos = datosFormulario(evento.target);
  if (datos.tipo !== "cliente") delete datos.direccion_postal;
  try {
    const usuario = await api("POST", "/usuarios", datos);
    aviso(`Usuario creado: ${usuario.nombre}`, "ok");
    evento.target.reset();
    $("tipo-usuario").onchange();
    await cargarUsuarios();
  } catch (error) {
    aviso(error.message, "error");
  }
};

$("form-producto").onsubmit = async (evento) => {
  evento.preventDefault();
  const datos = datosFormulario(evento.target);
  if (datos.tipo !== "electronico") delete datos.meses_garantia;
  if (datos.tipo !== "ropa") { delete datos.talla; delete datos.color; }
  datos.precio = Number(datos.precio);
  datos.stock = Number(datos.stock);
  if (datos.meses_garantia !== undefined) datos.meses_garantia = Number(datos.meses_garantia);
  try {
    const producto = await api("POST", "/productos", datos);
    aviso(`Producto creado: ${producto.nombre}`, "ok");
    evento.target.reset();
    mostrarCamposProducto();
    await cargarProductos();
  } catch (error) {
    aviso(error.message, "error");
  }
};

$("anadir-linea").onclick = () => {
  const producto = productos.find((p) => p.id === $("pedido-producto").value);
  const cantidad = Number($("pedido-cantidad").value);
  if (!producto) return aviso("No hay productos para añadir", "error");
  if (!Number.isInteger(cantidad) || cantidad < 1) return aviso("La cantidad tiene que ser un número mayor que 0", "error");
  lineas.push({ producto, cantidad });
  pintarLineas();
};

$("form-pedido").onsubmit = async (evento) => {
  evento.preventDefault();
  if (!lineas.length) return aviso("Añade al menos una línea al pedido", "error");
  const clienteId = $("pedido-cliente").value;
  try {
    const pedido = await api("POST", "/pedidos", {
      cliente_id: clienteId,
      items: lineas.map((l) => ({ producto_id: l.producto.id, cantidad: l.cantidad })),
    });
    aviso(`Pedido realizado: ${euros(pedido.total)}`, "ok");
    lineas = [];
    pintarLineas();
    $("historial-cliente").value = clienteId;
    await Promise.all([cargarProductos(), cargarPedidos()]);
  } catch (error) {
    aviso(error.message, "error");
  }
};

async function iniciar() {
  try {
    await cargarProductos();
    await cargarUsuarios();
  } catch (error) {
    aviso(error.message, "error");
  }
}

mostrarCamposProducto();
pintarLineas();
iniciar();
</script>
</body>
</html>
